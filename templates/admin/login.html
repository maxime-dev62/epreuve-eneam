{% extends "admin/base_admin.html" %}
{% block title %}Connexion admin{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 4rem auto;">
    <h2 style="text-align:center;">🔐 Connexion admin</h2>
    <p style="text-align:center; color:#666; margin-top:-0.5rem; margin-bottom:1.5rem;">
        Accès réservé à l'administration
    </p>

    <form method="POST">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" required autofocus autocomplete="username">

        <label>Mot de passe</label>
        <input type="password" name="password" required autocomplete="current-password">

        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem;">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}
